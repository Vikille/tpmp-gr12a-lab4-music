name: CI without external test framework
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ libsqlite3-dev lcov

    - name: Build application
      run: |
        mkdir -p bin
        g++ -std=c++17 -I includes src/main.cpp src/database.cpp src/auth.cpp src/menu.cpp src/utils.cpp -lsqlite3 -o bin/music_store

    - name: Build test runner with coverage
      run: |
        g++ -std=c++17 \
          --coverage \
          -I includes -I src \
          test/test_runner.cpp \
          src/utils.cpp src/auth.cpp src/database.cpp src/menu.cpp \
          -lsqlite3 \
          -o test_runner

    - name: Run tests
      run: ./test_runner

    - name: Generate coverage report
      run: |
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/test/*' --output-file coverage_filtered.info
        lcov --list coverage_filtered.info
        mkdir -p coverage_report
        genhtml coverage_filtered.info --output-directory coverage_report

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage_report/
